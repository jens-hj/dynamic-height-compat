plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'com.modrinth.minotaur' version '2.10.0'
}

java { withSourcesJar(); toolchain.languageVersion = JavaLanguageVersion.of(21) }
base { archivesName = 'dynamic-height-compat' }
repositories {
    mavenCentral()
    exclusiveContent {
        forRepository { maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
}

sourceSets {
    testmod {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}

def gameTestDirectory = layout.buildDirectory.dir('run/gameTest').get().asFile
def clientTestDirectory = layout.buildDirectory.dir('run/clientTest').get().asFile
def packMods = providers.gradleProperty('packMods')
neoForge {
    version = project.neo_version
    mods {
        dynamic_height_compat { sourceSet sourceSets.main }
        dynamic_height_compat_test { sourceSet sourceSets.testmod }
    }
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
        gameTestServer {
            type = 'gameTestServer'
            sourceSet = sourceSets.testmod
            gameDirectory = gameTestDirectory
            systemProperty 'neoforge.enabledGameTestNamespaces', 'dynamic_height_compat'
            programArgument '--spawnPos'
            programArgument '0,-59,0'
        }
        clientTest {
            client()
            sourceSet = sourceSets.testmod
            gameDirectory = clientTestDirectory
            systemProperty 'dynamicheightcompat.clientTest', 'true'
            systemProperty 'dynamicheightcompat.testResult', layout.buildDirectory.file('client-result.json').get().asFile.absolutePath
            systemProperty 'dynamicheightcompat.reload', providers.gradleProperty('reload').isPresent().toString()
            systemProperty 'dynamicheightcompat.test.minY', providers.gradleProperty('minY').getOrElse('-128')
            systemProperty 'dynamicheightcompat.test.maxY', providers.gradleProperty('maxY').getOrElse('1024')
            systemProperty 'dynamicheightcompat.test.highY', providers.gradleProperty('highY').getOrElse('512')
        }
    }
    runs.configureEach {
        jvmArgument "-Xmx${providers.gradleProperty('testHeap').getOrElse('3G')}"
        jvmArgument '-XX:ActiveProcessorCount=4'
        // Negative control: prove the installed Dynamic Height/Sable pair fails without our fix.
        if (providers.gradleProperty('baseline').isPresent()) {
            systemProperty 'dynamicheightcompat.test.disableStartupFix', 'true'
        }
        if (providers.gradleProperty('baselineBuildTools').isPresent()) {
            systemProperty 'dynamicheightcompat.test.disableBuildToolsFix', 'true'
        }
        if (providers.gradleProperty('baselineVoxy').isPresent()) {
            systemProperty 'dynamicheightcompat.test.disableVoxyFix', 'true'
        }
    }
}

dependencies {
    implementation "maven.modrinth:dynamic-height:${project.dynamic_height_version}"
    if (!providers.gradleProperty('withoutSable').isPresent()) {
        runtimeOnly "maven.modrinth:sable:${project.sable_version}"
    }
    testmodImplementation "maven.modrinth:moonlight:${project.moonlight_version}"
    testmodRuntimeOnly "maven.modrinth:jakes-build-tools:${project.build_tools_version}"
    if (providers.gradleProperty('supplementaries').isPresent()) {
        testmodRuntimeOnly "maven.modrinth:supplementaries:${project.supplementaries_version}"
    }
}

def prepareRun = { File directory ->
    directory.mkdirs()
    // Always merge the actual run directory's options before any graphical launch.
    def options = new File(directory, 'options.txt')
    def lines = options.exists() ? options.readLines().findAll {
        !(it.split(':', 2)[0] in ['soundCategory_master', 'soundCategory_music', 'onboardAccessibility',
                                  'narrator', 'pauseOnLostFocus', 'fullscreen', 'renderDistance',
                                  'simulationDistance', 'tutorialStep'])
    } : []
    options.text = (lines + ['soundCategory_master:0.0', 'soundCategory_music:0.0',
        'onboardAccessibility:false', 'narrator:0', 'pauseOnLostFocus:false', 'fullscreen:false',
        'renderDistance:3', 'simulationDistance:5', 'tutorialStep:none']).join('\n') + '\n'
    def mods = new File(directory, 'mods'); mods.mkdirs()
    // Each run uses exactly the requested diagnostic set, never leftovers from a prior set.
    mods.listFiles().findAll { java.nio.file.Files.isSymbolicLink(it.toPath()) }.each { it.delete() }
    if (packMods.isPresent()) {
        new File(packMods.get()).listFiles().findAll {
            it.name.endsWith('.jar') && !it.name.startsWith('dynamic-height-compat-') &&
            !it.name.startsWith('dynamicheight-') && !it.name.startsWith('sable-neoforge-') &&
            !it.name.startsWith('moonlight-') && !it.name.startsWith('supplementaries-') &&
            !it.name.startsWith('jakes-build-tools-')
        }.each { source ->
            def target = new File(mods, source.name).toPath()
            if (!java.nio.file.Files.exists(target)) java.nio.file.Files.createSymbolicLink(target, source.toPath().toRealPath())
        }
    }
}
tasks.named('runClient') { doFirst { prepareRun(file('run')) } }
def reloadTest = providers.gradleProperty('reload').isPresent()
tasks.named('runClientTest') {
    doFirst {
        prepareRun(clientTestDirectory)
        if (!reloadTest) new File(clientTestDirectory, 'saves/compat-height-test').deleteDir()
    }
}
tasks.named('runGameTestServer') {
    doFirst {
        prepareRun(gameTestDirectory)
        // Never reuse chunks/light data from baseline or different-height test runs.
        new File(gameTestDirectory, 'world').deleteDir()
        // Dynamic Height promotes vanilla-sized ranges to its 32K default; use explicit extended bounds.
        def height = new File(gameTestDirectory, 'world/data/dynamic_height_minecraft_overworld.config')
        height.parentFile.mkdirs()
        height.text = '{"format":"dynamicheight-worldheight-v1","minY":-128,"maxY":1024}\n'
    }
}

tasks.withType(Jar).configureEach { from('LICENSE') }
def releaseVersion = project.version.toString()
processResources {
    inputs.property 'version', releaseVersion
    filesMatching('META-INF/neoforge.mods.toml') { expand version: releaseVersion }
}

def modrinthToken = providers.environmentVariable('MODRINTH_TOKEN').orElse(
    providers.fileContents(layout.projectDirectory.file(
        "${System.getProperty('user.home')}/.config/modrinth-token")).asText.map { it.trim() })
def currentChangelog = providers.fileContents(layout.projectDirectory.file('CHANGELOG.md')).asText.map { text ->
    def section = text.split(/(?m)^## /).find { it.startsWith("${version}\n") || it.startsWith("${version}\r") }
    section ? section.substring(section.indexOf('\n') + 1).trim() : ''
}
modrinth {
    debugMode = providers.gradleProperty('modrinthDryRun').isPresent()
    token = modrinthToken
    projectId = 'L51WyOj4'
    versionNumber = project.version.toString()
    versionName = "${project.version} (NeoForge ${project.minecraft_version})"
    versionType = 'alpha'
    environment = 'client_and_server'
    uploadFile = jar
    additionalFiles { sourcesJar(tasks.named('sourcesJar')) }
    gameVersions = [project.minecraft_version]
    loaders = ['neoforge']
    changelog = currentChangelog
    dependencies {
        required.version project.dynamic_height_version
        optional.version project.sable_version
        optional.version project.moonlight_version
        optional.version project.supplementaries_version
        optional.version project.build_tools_version
        optional.version project.voxy_version
        optional.version project.roxy_version
    }
    syncBodyFrom = file('docs/MODRINTH.md').text
}
tasks.named('modrinth') { notCompatibleWithConfigurationCache('Minotaur reads Task.project') }
tasks.named('modrinthSyncBody') { notCompatibleWithConfigurationCache('Minotaur reads Task.project') }
